name: xnash_portfolio
description: XNash portfolio — xynovim in the browser.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMonoNF
      fonts:
        - asset: assets/fonts/JetBrainsMonoNerdFont-Regular.ttf
        - asset: assets/fonts/JetBrainsMonoNerdFont-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMonoNerdFont-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMonoNerdFont-BoldItalic.ttf
          weight: 700
          style: italic
